<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Flag Manager - SSO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .login-section {
            text-align: center;
            padding: 40px 0;
        }

        .btn-login {
            background: #0078d4;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-login:hover {
            background: #106ebe;
        }

        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-logout {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 20px;
        }

        .btn-logout:hover {
            background: #c82333;
        }

        .user-info {
            display: none;
        }

        .user-info.active {
            display: block;
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 24px;
            border-bottom: 2px solid #f0f0f0;
        }

        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .user-details h2 {
            color: #333;
            font-size: 22px;
            margin-bottom: 4px;
        }

        .user-details p {
            color: #666;
            font-size: 14px;
        }

        .info-grid {
            display: grid;
            gap: 16px;
        }

        .info-item {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .info-value {
            color: #333;
            font-size: 15px;
            word-break: break-all;
        }

        .token-section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 2px solid #f0f0f0;
        }

        .token-container {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 8px;
            margin-top: 12px;
            position: relative;
        }

        .token-text {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #333;
            word-break: break-all;
            line-height: 1.6;
            max-height: 200px;
            overflow-y: auto;
        }

        .btn-copy {
            background: #28a745;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.3s;
        }

        .btn-copy:hover {
            background: #218838;
        }

        .loading {
            display: none;
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            border-left: 4px solid #dc3545;
            display: none;
        }

        .error-message.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Feature Flag Manager</h1>
        <p class="subtitle">Sistema de gerenciamento de feature flags com autenticação Microsoft SSO</p>

        <div class="login-section" id="loginSection">
            <button class="btn-login" id="btnLogin">
                <svg width="21" height="21" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M0 0H10V10H0V0Z" fill="#F25022" />
                    <path d="M11 0H21V10H11V0Z" fill="#7FBA00" />
                    <path d="M0 11H10V21H0V11Z" fill="#00A4EF" />
                    <path d="M11 11H21V21H11V11Z" fill="#FFB900" />
                </svg>
                Entrar com Microsoft
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Autenticando...</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="user-info" id="userInfo">
            <div class="user-header">
                <div class="user-avatar" id="userAvatar"></div>
                <div class="user-details">
                    <h2 id="userName"></h2>
                    <p id="userEmail"></p>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">User ID</div>
                    <div class="info-value" id="userId"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Username</div>
                    <div class="info-value" id="userUsername"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Tenant ID</div>
                    <div class="info-value" id="userTenant"></div>
                </div>
            </div>

            <div class="token-section">
                <h3>Access Token</h3>
                <div class="token-container">
                    <div class="token-text" id="accessToken"></div>
                    <button class="btn-copy" id="btnCopyToken">📋 Copiar Token</button>
                </div>
            </div>

            <div style="text-align: center;">
                <button class="btn-logout" id="btnLogout">Sair</button>
            </div>
        </div>
    </div>

    <script src="sso.js"></script>
</body>

</html>
